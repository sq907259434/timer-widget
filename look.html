<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置</title>
<style>
  /* 独立浮窗：贴在卡片外侧，不挡卡片本身。
     卡片 mini 态只有 260x240，把设置项塞进卡片里字会小到看不清。
     整块可拖动（-webkit-app-region:drag），控件区域单独设成 no-drag。 */
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:transparent; overflow:hidden;
    font-family:-apple-system,"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
    color:#fff; cursor:default; user-select:none;
  }
  .box{
    -webkit-app-region:drag;
    position:absolute; inset:0;
    border-radius:14px;
    background:rgba(16,20,28,.97);
    box-shadow:0 8px 26px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.09);
    padding:9px 12px 9px;
    display:flex; flex-direction:column; gap:7px;
  }
  body.light .box{
    background:rgba(252,252,252,.99);
    color:#111;
    box-shadow:0 8px 26px rgba(0,0,0,.16), inset 0 0 0 1px rgba(0,0,0,.07);
  }
  h4{
    margin:0 0 0 22px; font-size:11px; font-weight:600; letter-spacing:.4px;
    color:rgba(255,255,255,.55);
  }
  body.light h4{ color:rgba(0,0,0,.5); }
  .back{
    -webkit-app-region:no-drag;
    position:absolute; left:8px; top:8px; width:16px; height:16px; border:0; padding:0;
    border-radius:50%; background:rgba(255,255,255,.08); color:rgba(255,255,255,.7);
    font-size:12px; line-height:1; cursor:pointer; display:grid; place-items:center;
  }
  .back:hover{ background:rgba(255,255,255,.2); color:#fff; }
  body.light .back{ background:rgba(0,0,0,.07); color:rgba(0,0,0,.55); }
  body.light .back:hover{ background:rgba(0,0,0,.14); color:#111; }
  .x{
    -webkit-app-region:no-drag;
    position:absolute; right:8px; top:8px; width:16px; height:16px; border:0; padding:0;
    border-radius:50%; background:rgba(255,255,255,.08); color:rgba(255,255,255,.6);
    font-size:13px; line-height:1; cursor:pointer; display:grid; place-items:center;
  }
  .x:hover{ background:rgba(255,255,255,.18); color:#fff; }
  body.light .x{ background:rgba(0,0,0,.07); color:rgba(0,0,0,.5); }
  body.light .x:hover{ background:rgba(0,0,0,.14); color:#111; }

  .row{
    -webkit-app-region:no-drag;
    display:flex; align-items:center; gap:8px; height:24px; font-size:11px;
  }
  .row > span{ flex:0 0 44px; color:rgba(255,255,255,.7); }
  body.light .row > span{ color:rgba(0,0,0,.62); }
  .row b{ flex:0 0 40px; text-align:right; font-weight:500; color:rgba(255,255,255,.5);
          font-variant-numeric:tabular-nums; }
  body.light .row b{ color:rgba(0,0,0,.45); }

  input[type=range]{
    flex:1 1 auto; min-width:0; height:4px; -webkit-appearance:none; appearance:none;
    background:rgba(255,255,255,.16); border-radius:2px; outline:none; cursor:pointer;
  }
  body.light input[type=range]{ background:rgba(0,0,0,.14); }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#9CB4D8; box-shadow:0 1px 3px rgba(0,0,0,.4); cursor:grab;
  }

  /* 分段按钮组 */
  .seg{ -webkit-app-region:no-drag; display:flex; flex:1 1 auto; gap:4px; }
  .seg button{
    flex:1 1 0; height:22px; border:0; border-radius:6px; cursor:pointer;
    font-size:11px; font-family:inherit; white-space:nowrap;
    background:rgba(255,255,255,.07); color:rgba(255,255,255,.72);
  }
  .seg button:hover{ background:rgba(255,255,255,.14); }
  .seg button.on{ background:#9CB4D8; color:#12161d; font-weight:600; }
  body.light .seg button{ background:rgba(0,0,0,.06); color:rgba(0,0,0,.7); }
  body.light .seg button:hover{ background:rgba(0,0,0,.12); }
  body.light .seg button.on{ background:#7f9dc4; color:#fff; }

  .step{ -webkit-app-region:no-drag; display:flex; align-items:center; gap:4px; flex:1 1 auto; }
  .step button{
    width:24px; height:22px; border:0; border-radius:6px; cursor:pointer;
    background:rgba(255,255,255,.07); color:rgba(255,255,255,.8);
    font-size:13px; line-height:1; font-family:inherit;
  }
  .step button:hover{ background:rgba(255,255,255,.16); }
  body.light .step button{ background:rgba(0,0,0,.06); color:rgba(0,0,0,.75); }
  body.light .step button:hover{ background:rgba(0,0,0,.13); }
  .step i{ flex:1 1 auto; text-align:center; font-style:normal; font-size:11px;
           color:rgba(255,255,255,.7); font-variant-numeric:tabular-nums; }
  body.light .step i{ color:rgba(0,0,0,.6); }
</style>
</head>
<body>
  <div class="box">
    <h4>设置</h4>
    <button class="back" id="back" title="返回">‹</button>
    <button class="x" id="x" title="关闭">×</button>

    <label class="row"><span>透明度</span><input id="a" type="range" min="8" max="100" step="1"><b id="av"></b></label>

    <div class="row"><span>主题</span>
      <div class="seg" id="segTheme">
        <button data-v="auto">跟随</button>
        <button data-v="light">浅色</button>
        <button data-v="dark">深色</button>
      </div>
    </div>

    <div class="row"><span>单位</span>
      <div class="seg" id="segUnit">
        <button data-v="min">分</button>
        <button data-v="sec">秒</button>
      </div>
    </div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  document.body.classList.toggle("light", (window.look && window.look.theme) === "light");

  let cur = { alpha: 1, theme: "auto", unit: "min" };

  function seg(id, val) {
    [...$(id).children].forEach((b) => b.classList.toggle("on", b.dataset.v === val));
  }
  function paint() {
    $("av").textContent = Math.round(cur.alpha * 100) + "%";
    $("a").value = Math.round(cur.alpha * 100);
    seg("segTheme", cur.theme);
    seg("segUnit", cur.unit);
  }
  function pushLook() { window.look.set({ alpha: cur.alpha }); }
  function pushSettings() {
    window.look.setSettings({ theme: cur.theme, unit: cur.unit });
  }

  /* 透明度：拖动中就要实时生效（原来只在松手时写，用户以为卡了）。
     60ms 节流，避免每一像素都发一次 IPC。 */
  let alphaTimer = 0;
  $("a").addEventListener("input", () => {
    cur.alpha = Math.min(1, Math.max(0.08, Number($("a").value) / 100));
    $("av").textContent = Math.round(cur.alpha * 100) + "%";
    if (alphaTimer) return;
    alphaTimer = setTimeout(() => { alphaTimer = 0; pushLook(); }, 60);
  });
  $("a").addEventListener("change", () => { if (alphaTimer) { clearTimeout(alphaTimer); alphaTimer = 0; } pushLook(); });

  /* 三组分段按钮 */
  [["segTheme", "theme"], ["segUnit", "unit"]].forEach(([id, key]) => {
    $(id).addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      cur[key] = b.dataset.v;
      paint(); pushSettings();
    });
  });

  $("back").addEventListener("click", () => window.look.close());
  $("x").addEventListener("click", () => window.look.close());

  paint();
  window.look.get().then((v) => { if (v && v.alpha) { cur.alpha = Number(v.alpha) || 1; paint(); } }).catch(() => {});
  window.look.getSettings().then((v) => {
    if (!v) return;
    cur.theme = v.theme || "auto";
    cur.unit = v.unit === "sec" ? "sec" : "min";
    paint();
  }).catch(() => {});
</script>
</body>
</html>
